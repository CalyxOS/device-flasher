# Keep this image in sync with IMAGE in build.sh
image: golang:1.26.8

variables:
  GOCACHE: /tmp/gocache
  GOPATH: /tmp/gopath
  GIT_DEPTH: 0

stages:
  - test
  - build
  - deploy

format:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)
    - go test -race $(go list ./... | grep -v /vendor/)

compile:
  stage: build
  script:
    - make
  artifacts:
    name: device-flasher
    expire_in: 1 week
    paths:
      - '*.linux'
      - '*.exe'
      - '*.darwin'
      - '*.sha256sum'
